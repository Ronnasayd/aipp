# rag-rat configuration — generated by `rag-rat init`; edit freely.
# Active lines below reflect this repo; commented tables show the tunable defaults.
# Full reference: docs/config.md.

[index]
root = "."
# The index and repo memories live in the machine-global database by default
# ($XDG_DATA_HOME/rag-rat/rag-rat.sqlite; override the location with RAG_RAT_DATA_DIR).
# Uncomment to keep this repo on its own per-repo file instead (deprecated):
# database = ".rag-rat/index.sqlite"

# Language → directories to index. Each language indexes its default file extensions in the
# listed dirs; a `cpp` binding also claims `.h` headers (indexed as C++), a `c` binding
# claims `.c` + `.h`. Add or remove languages and directories as your layout needs.
[target_bindings]
typescript = ["claude/dev-mods"]
python = ["hooks/evals", "hooks/scripts", "lefthook/scripts", "legacy/backups", "legacy/hooks", "legacy/prompts/scripts", "scripts", "skills/anthropics/docx/scripts", "skills/anthropics/mcp-builder/scripts", "skills/anthropics/pdf/scripts", "skills/anthropics/skill-creator/eval-viewer", "skills/anthropics/skill-creator/scripts", "skills/anthropics/webapp-testing/examples", "skills/anthropics/webapp-testing/scripts", "skills/anthropics/xlsx/scripts", "skills/apk-reverse/scripts", "skills/context-map/scripts", "skills/everything-claude-code/agent-self-evaluation/scripts", "skills/extract-automation-candidates/scripts", "skills/extract-software-requirements/scripts", "skills/figma/figma-to-code-agentic/scripts", "skills/generate-docs/scripts", "skills/generate-pr-description/scripts", "skills/handling-large-files/scripts", "skills/image-mockup-recreator/scripts", "skills/prd-generator/scripts", "skills/sd-insert-taskmaster/scripts", "skills/spec-to-requirements-table/scripts", "skills/srs-generator/scripts", "skills/ste/scripts", "skills/tech-leads-club/gh-address-comments/scripts", "skills/tech-leads-club/gh-fix-ci/scripts", "skills/tech-leads-club/harness-eval/scripts", "skills/tech-leads-club/skill-architect/scripts", "skills/tech-leads-club/the-judge/scripts", "src"]
markdown = ["."]

# Richer targets (uncomment to use): a named target with an explicit kind and custom file
# globs — the only way to bind generated / test / docs trees or a non-default file set.
# `kind` is source|generated|docs|tests; `include`/`exclude` are `**/*.<ext>` globs.
# [[target]]
# name = "generated-bindings"
# language = "typescript"
# directories = ["packages/app/src/generated"]
# kind = "generated"
# include = ["**/*.ts"]
# exclude = ["**/*.map"]

[llm.embedding]
# model2vec — static embeddings; ~100-500x faster on CPU, some quality cost
model = "minishlab/potion-retrieval-32M"

# Embedding runtime tuning (defaults shown; uncomment to override).
# [llm.embedding.runtime]
# batch_size = 64
# ort_threads = 4          # ONNX intra-op threads
# omp_threads = 1
# max_embedding_chars = 4000

# Remote Ollama embedding (optional; defaults shown; uncomment to offload embedding).
# [llm.embedding.remote]
# endpoint = "http://localhost:11434"
# model = "all-minilm"          # Ollama-side model name for the selected embedding model
# batch_size = 256          # texts per /api/embed request
# concurrency = 1           # CONNECT-safe; cookbook/ephemeral default = 32
# max_batch_chars = 384000 # max input chars per /api/embed request
# request_timeout_s = 60
# num_ctx = 4096            # optional Ollama context window

# Init wizard cookbook catalog (optional). These entries only affect `rag-rat init` selectors;
# runtime uses the selected `[llm.embedding.remote] cookbook` and `gpu` strings verbatim.
# [init.cookbooks.modal]
# label = "Modal"
# command = "@rag-rat/cookbook modal"
# gpus = ["T4", "L4", "A10", "H100"]
#
# [init.cookbooks.my-provider]
# label = "My Provider"
# command = "./recipes/my-provider.mjs"
# gpus = ["small", "large"]

[llm.distill]
# Turn closed issues & PRs into typed decision records (opt-in model pass; needs an issue
# tracker below). Run it with `rag-rat distill drain`.
enabled = false
# Serving — the wizard writes this block when you enable distillation. Default is an ephemeral
# 30B GPU box; a connect endpoint is the alternative.
# [llm.distill.remote]
# backend = "vllm"
# cookbook = "@rag-rat/cookbook modal"
# gpu = "L40S"
# model = "Qwen/Qwen3-30B-A3B-Instruct-2507-FP8"
# provision_timeout_s = 1500   # cold-pull budget, under the box's 30-min lifetime
# request_timeout_s = 240

# Background file watcher — keeps the index fresh as files change (defaults shown).
# [watch]
# enabled = true
# debounce_ms = 400           # quiet window before a reindex pass
# max_latency_ms = 2500       # force a pass after this much continuous activity
# periodic_sweep_secs = 300   # backstop pass interval, 0 disables
# pass_cooldown_secs = 60     # minimum gap between event-driven passes, 0 disables
# overlay_quiet_secs = 300    # linked-worktree quiet window for uncommitted edits, 0 disables

# Check crates.io for a newer rag-rat and surface it. Best-effort, cached, never blocks.
# [version_check]
# enabled = true

# Issue tracker (optional). With NO [[tracker]] block the binding is auto-detected from the
# git origin remote (github.com / gitlab.* / bitbucket.org). Write one to pin auth, a self-
# hosted instance, or Jira (never auto-detected). `auth` is exactly one of env / token_command.
# [[tracker]]
# provider = "github"           # github | gitlab | bitbucket | jira
# project = "owner/repo"        # optional for code hosts (derived from the remote); required for jira
# base_url = "https://gitlab.example.com"  # self-hosted / enterprise only
# auth = { token_command = "gh auth token" }  # or { env = "GITHUB_TOKEN" }
# tags = ["bug", "perf"]        # only mirror matching issues/PRs; empty = all
#
# Papertrail sync cadence (defaults shown).
# [papertrail]
# probe_interval_secs = 900
# sync_min_interval_secs = 900
# full_sync_interval_secs = 86400
# rate_limit_reserve = 0.35     # fraction of the API quota kept for your own tools

# Debug logging — per-process files under `.rag-rat/logs/` (off by default). Traces the git-hook
# maintenance / reconcile / embedding lifecycle. `RAG_RAT_LOG` (RUST_LOG-style) overrides
# `level`/`filter` and can force-enable it for a single command.
# [log]
# enabled = false
# level = "info"              # off | error | warn | info | debug | trace
# filter = "rag_rat_core::index::ai=debug"   # optional per-subsystem directives
# format = "text"             # text | json
# retention_days = 7          # prune log files older than this on startup
# max_files = 200             # cap on files kept (oldest pruned first)

[oracle]
# Background auto-refresh of compiler-grade (SCIP) importance ranking. Needs a language
# tool on PATH (e.g. rust-analyzer); runs throttled in the MCP server only. Default off.
auto_run = false
# auto_run_quiet_period_secs = 900    # run only after the index has been this quiet
# auto_run_min_interval_secs = 21600  # and at most this often, regardless of churn
