agents:
- name:
  - explorer-specialist.agent.md
  description: Fast, cheap, read-only codebase explorer that maps structure, locates
    symbols and callers, traces data flow, and extracts coding conventions and anti-patterns,
    returning a compact path:line report. Use for broad searches that would read many
    files, codebase onboarding, impact analysis before a change, and rule extraction
    (the codebase-rules-extractor skill delegates its analysis here). It never edits
    files and never suggests fixes unless asked.
- name:
  - developer-specialist.agent.md
  description: Implementer that builds features and fixes bugs end to end with TDD,
    in thin vertical slices, and returns evidence (test output) that the change works.
    Use to delegate a well-scoped implementation task, or to run several independent
    tasks in parallel (pass isolation worktree on the call when tasks touch the same
    files). Domain knowledge (databases, security, design patterns, frontend) comes
    from skills, not from separate agents. Do not use it for review or planning.
- name:
  - qa-specialist.agent.md
  description: QA engineer that verifies the running system end to end (browser, API,
    CLI) with Playwright or similar tools, logs reproducible bug reports, and returns
    a go/no-go verdict with evidence. Use before finalizing UI or behavior changes,
    for regression passes, and for release sign-off; it keeps noisy browser and test
    output out of the main conversation. It may write new E2E test files but never
    edits existing source. Do not use it for code-level coverage audits (use reviewer-specialist
    with the coverage focus).
- name:
  - reviewer-specialist.agent.md
  description: Independent read-only reviewer that audits code diffs, test coverage,
    security, and specs (PRD, task spec, design) against the real code, and returns
    severity-ranked findings without editing anything. Use after implementation or
    before approval, when the author must not be the verifier. Spawn several in parallel
    with different focuses (quality, coverage, security, spec conformance). Never
    use it to implement or refactor; hand findings to developer-specialist.
- name:
  - planner-specialist.agent.md
  description: Read-only senior architect that researches the codebase and external
    documentation, compares approaches, and returns an implementation plan of small
    vertical slices with risks and open questions. Use before implementing non-trivial
    features, migrations, refactors, or technology choices, when the research would
    flood the main conversation. It cannot ask the user questions; it returns open
    questions for the caller to resolve. It never edits files.
