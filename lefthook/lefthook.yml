# Lefthook config — migrated from git-hooks/ (symlinked git hooks).
# Install: `lefthook install` (run once per clone).
# Bypass: `git commit --no-verify` (see lefthook/scripts/commit-msg.py for why this exists).

pre-commit:
  follow: true
  commands:
    format-staged:
      run: uv run --project $($AI_PROJECT_ROOT_DIR/lefthook/scripts/pick_uv_project.sh) $AI_PROJECT_ROOT_DIR/lefthook/scripts/format_staged.py
    lint-staged:
      run:
        uv run --project $($AI_PROJECT_ROOT_DIR/lefthook/scripts/pick_uv_project.sh) $AI_PROJECT_ROOT_DIR/hooks/scripts/lint_changed.py
        --staged
    test-staged:
      run:
        uv run --project $($AI_PROJECT_ROOT_DIR/lefthook/scripts/pick_uv_project.sh) $AI_PROJECT_ROOT_DIR/hooks/scripts/test_changed.py
        --staged
    comment-policy-staged:
      run:
        uv run --project $($AI_PROJECT_ROOT_DIR/lefthook/scripts/pick_uv_project.sh) $AI_PROJECT_ROOT_DIR/lefthook/scripts/comment_policy_check.py
commit-msg:
  follow: true
  commands:
    conventional-commits:
      run:
        uv run --project $($AI_PROJECT_ROOT_DIR/lefthook/scripts/pick_uv_project.sh) $AI_PROJECT_ROOT_DIR/lefthook/scripts/conventional-commits-commit-msg.py
        {1}
    reject-ai-mentions:
      run:
        uv run --project $($AI_PROJECT_ROOT_DIR/lefthook/scripts/pick_uv_project.sh) $AI_PROJECT_ROOT_DIR/lefthook/scripts/commit-msg.py
        {1}
    reject-emoji:
      run:
        uv run --project $($AI_PROJECT_ROOT_DIR/lefthook/scripts/pick_uv_project.sh) $AI_PROJECT_ROOT_DIR/lefthook/scripts/reject-emoji-commit-msg.py
        {1}
    reject-non-english:
      run:
        uv run --project $($AI_PROJECT_ROOT_DIR/lefthook/scripts/pick_uv_project.sh) $AI_PROJECT_ROOT_DIR/lefthook/scripts/reject-non-english-commit-msg.py
        {1}
# why: rag-rat-maintenance runs detached (nohup + redirected fds) so git returns
# immediately; lefthook would otherwise wait on the open stdout/stderr pipes.
post-commit:
  follow: true
  commands:
    semantic-version-bump:
      run:
        uv run --project $($AI_PROJECT_ROOT_DIR/lefthook/scripts/pick_uv_project.sh) $AI_PROJECT_ROOT_DIR/lefthook/scripts/semantic_version_bump.py
    rag-rat-maintenance:
      run:
        test -f rag-rat.toml && (nohup rag-rat maintenance --trigger post-commit
        > /tmp/rag-rat-maintenance.log 2>&1 < /dev/null &) || true
post-checkout:
  commands:
    rag-rat-maintenance:
      run:
        test -f rag-rat.toml && (nohup rag-rat maintenance --trigger post-checkout --old-head '{1}' --new-head '{2}' --branch-checkout '{3}'
        > /tmp/rag-rat-maintenance.log 2>&1 < /dev/null &) || true
post-merge:
  commands:
    rag-rat-maintenance:
      run:
        test -f rag-rat.toml && (nohup rag-rat maintenance --trigger post-merge
        > /tmp/rag-rat-maintenance.log 2>&1 < /dev/null &) || true
post-rewrite:
  commands:
    rag-rat-maintenance:
      run:
        test -f rag-rat.toml && (nohup rag-rat maintenance --trigger post-rewrite
        > /tmp/rag-rat-maintenance.log 2>&1 < /dev/null &) || true
pre-push:
  follow: true
  commands:
    jest:
      run: $AI_PROJECT_ROOT_DIR/lefthook/scripts/pre-push-jest
    typecheck:
      run: $AI_PROJECT_ROOT_DIR/lefthook/scripts/pre-push-typecheck
    push-pending-tags:
      run:
        uv run --project $($AI_PROJECT_ROOT_DIR/lefthook/scripts/pick_uv_project.sh) $AI_PROJECT_ROOT_DIR/lefthook/scripts/push_pending_tags.py
