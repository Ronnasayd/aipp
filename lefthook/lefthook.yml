# Lefthook config — migrated from git-hooks/ (symlinked git hooks).
# Install: `lefthook install` (run once per clone).
# Bypass: `git commit --no-verify` (see lefthook/scripts/commit-msg.py for why this exists).
#
# NOTE: post-checkout, post-commit, post-merge, post-rewrite hooks still live
# directly in .git/hooks/ and are NOT migrated here yet — protected path,
# content unknown. Migrate those once their source is available.

pre-commit:
  commands:
    format-staged:
      run: uv run --project $AI_PROJECT_ROOT_DIR $AI_PROJECT_ROOT_DIR/lefthook/scripts/format_staged.py
    lint-staged:
      run:
        uv run --project $AI_PROJECT_ROOT_DIR $AI_PROJECT_ROOT_DIR/hooks/scripts/lint_changed.py
        --staged
    test-staged:
      run:
        uv run --project $AI_PROJECT_ROOT_DIR $AI_PROJECT_ROOT_DIR/hooks/scripts/test_changed.py
        --staged
commit-msg:
  commands:
    conventional-commits:
      run:
        uv run --project $AI_PROJECT_ROOT_DIR $AI_PROJECT_ROOT_DIR/lefthook/scripts/conventional-commits-commit-msg.py
        {1}
    reject-ai-mentions:
      run:
        uv run --project $AI_PROJECT_ROOT_DIR $AI_PROJECT_ROOT_DIR/lefthook/scripts/commit-msg.py
        {1}
    reject-emoji:
      run:
        uv run --project $AI_PROJECT_ROOT_DIR $AI_PROJECT_ROOT_DIR/lefthook/scripts/reject-emoji-commit-msg.py
        {1}
    reject-non-english:
      run:
        uv run --project $AI_PROJECT_ROOT_DIR $AI_PROJECT_ROOT_DIR/lefthook/scripts/reject-non-english-commit-msg.py
        {1}
post-commit:
  commands:
    semantic-version-bump:
      run:
        uv run --project $AI_PROJECT_ROOT_DIR $AI_PROJECT_ROOT_DIR/lefthook/scripts/semantic_version_bump.py
pre-push:
  commands:
    jest:
      run: $AI_PROJECT_ROOT_DIR/lefthook/scripts/pre-push-jest
    typecheck:
      run: $AI_PROJECT_ROOT_DIR/lefthook/scripts/pre-push-typecheck
    push-pending-tags:
      run:
        uv run --project $AI_PROJECT_ROOT_DIR $AI_PROJECT_ROOT_DIR/lefthook/scripts/push_pending_tags.py
